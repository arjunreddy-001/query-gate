services:
  querygate-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: QueryGate
      POSTGRES_USER: querygate
      POSTGRES_PASSWORD: "${DB_PASSWORD:-QueryGateDefault!2026}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querygate -d QueryGate"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  query-gate:
    build: .
    restart: unless-stopped
    depends_on:
      querygate-postgres:
        condition: service_healthy
    ports:
      - "${PORT:-5176}:5176"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5176
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      DB_PASSWORD: "${DB_PASSWORD:-QueryGateDefault!2026}"
      ConnectionStrings__DefaultConnection: "Host=querygate-postgres;Port=5432;Database=QueryGate;Username=querygate;Password=${DB_PASSWORD:-QueryGateDefault!2026}"
      Encryption__Key: "${ENCRYPTION_KEY:-}"
      Jwt__Key: "${JWT_KEY:-}"
      BootstrapAdmin__Email: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BootstrapAdmin__Password: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      Database__ApplyMigrationsOnStartup: "${APPLY_MIGRATIONS:-true}"
      DataProtection__KeyPath: /var/query-gate/keys
    volumes:
      - data-protection-keys:/var/query-gate/keys

volumes:
  postgres-data:
  data-protection-keys:
