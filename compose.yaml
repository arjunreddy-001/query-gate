services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-QueryGateDefault!2026}"
    volumes:
      - mssql-data:/var/opt/mssql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  query-gate:
    build: .
    restart: unless-stopped
    depends_on:
      mssql:
        condition: service_healthy
    ports:
      - "${PORT:-5176}:5176"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5176
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__DefaultConnection: "${DB_CONNECTION_STRING:-Server=mssql;Database=QueryGate;User Id=sa;Password=${DB_PASSWORD:-QueryGateDefault!2026};TrustServerCertificate=True;Encrypt=False}"
      Encryption__Key: "${ENCRYPTION_KEY:-}"
      Jwt__Key: "${JWT_KEY:-}"
      BootstrapAdmin__Email: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BootstrapAdmin__Password: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      Database__ApplyMigrationsOnStartup: "${APPLY_MIGRATIONS:-true}"
      DataProtection__KeyPath: /var/query-gate/keys
    volumes:
      - data-protection-keys:/var/query-gate/keys

volumes:
  mssql-data:
  data-protection-keys:
